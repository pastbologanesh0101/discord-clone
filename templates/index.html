<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discord Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #313338; color: #dbdee1; height: 100vh; display: flex; flex-direction: column;
  }
  #login {
    margin: auto; background: #2b2d31; padding: 32px; border-radius: 8px; width: 320px;
  }
  #login h1 { font-size: 20px; margin-top: 0; }
  #login input {
    width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none;
    background: #1e1f22; color: #dbdee1;
  }
  #login button, .primary-btn {
    width: 100%; padding: 10px; border-radius: 4px; border: none; background: #5865f2;
    color: white; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  #app { display: none; flex: 1; min-height: 0; }
  #servers {
    width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 8px; overflow-y: auto;
  }
  .server-icon {
    width: 48px; height: 48px; border-radius: 24px; background: #313338; color: #dbdee1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 600;
    border: 2px solid transparent;
  }
  .server-icon.active { border-radius: 16px; border-color: #5865f2; background: #5865f2; }
  #channels {
    width: 220px; background: #2b2d31; padding: 12px; overflow-y: auto; flex-shrink: 0;
  }
  #channels h2 { font-size: 14px; text-transform: uppercase; color: #949ba4; margin: 4px 0 12px; }
  .channel-item {
    padding: 6px 8px; border-radius: 4px; cursor: pointer; color: #949ba4; margin-bottom: 2px;
  }
  .channel-item.active { background: #404249; color: white; }
  .channel-item:hover { background: #35373c; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #channel-header {
    padding: 12px 16px; border-bottom: 1px solid #26282c; font-weight: 600;
  }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .message { margin-bottom: 12px; }
  .message .meta { font-size: 12px; color: #949ba4; margin-bottom: 2px; }
  .message .author { color: #f2f3f5; font-weight: 600; margin-right: 6px; }
  .message .content { color: #dbdee1; word-wrap: break-word; }
  .message .del-btn {
    font-size: 11px; color: #f23f42; cursor: pointer; margin-left: 8px; display: none;
  }
  .message:hover .del-btn { display: inline; }
  #composer { padding: 16px; display: flex; gap: 8px; }
  #composer input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: none; background: #383a40; color: #dbdee1;
  }
  #sidebar-actions { display: flex; gap: 6px; margin-bottom: 12px; }
  #sidebar-actions button {
    flex: 1; font-size: 11px; padding: 6px; border-radius: 4px; border: none;
    background: #404249; color: #dbdee1; cursor: pointer;
  }
  #invite-box { font-size: 12px; color: #949ba4; margin-top: 12px; word-break: break-all; }
  .hint { font-size: 12px; color: #949ba4; }
  #error-banner {
    display: none; background: #f23f42; color: white; padding: 8px 16px; font-size: 13px;
  }
</style>
</head>
<body>

<div id="login">
  <h1>Discord Clone</h1>
  <p class="hint">Pick a username to get started. No password — this is a demo.</p>
  <input id="username-input" placeholder="username" autofocus>
  <button class="primary-btn" onclick="login()">Continue</button>
</div>

<div id="error-banner"></div>

<div id="app">
  <div id="servers"></div>
  <div id="channels">
    <div id="sidebar-actions">
      <button onclick="promptCreateServer()">+ Server</button>
      <button onclick="promptJoinServer()">Join</button>
    </div>
    <h2>Channels</h2>
    <div id="channel-list"></div>
    <button class="primary-btn" id="new-channel-btn" style="display:none" onclick="promptCreateChannel()">+ Channel</button>
    <div id="invite-box"></div>
  </div>
  <div id="main">
    <div id="channel-header">Select a channel</div>
    <div id="messages"></div>
    <div id="composer">
      <input id="message-input" placeholder="Message..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="primary-btn" style="width:auto" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
let socket = null;
let me = null; // {user_id, username}
let servers = [];
let currentServerId = null;
let currentChannelId = null;
let currentServerRole = null;

function showError(msg) {
  const banner = document.getElementById('error-banner');
  banner.textContent = msg;
  banner.style.display = 'block';
  setTimeout(() => banner.style.display = 'none', 4000);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || 'request failed');
  return body;
}

async function login() {
  const username = document.getElementById('username-input').value.trim();
  if (!username) return;
  try {
    me = await api('/api/users', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username})
    });
  } catch (e) {
    showError(e.message);
    return;
  }
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  socket = io();
  socket.on('new_message', (msg) => {
    if (msg.channel_id === currentChannelId) renderMessage(msg);
  });
  socket.on('message_deleted', (data) => {
    const el = document.querySelector(`[data-message-id="${data.message_id}"]`);
    if (el) el.remove();
  });

  await refreshServers();
}

async function refreshServers() {
  servers = await api(`/api/servers?user_id=${me.user_id}`);
  const list = document.getElementById('servers');
  list.innerHTML = '';
  servers.forEach(s => {
    const div = document.createElement('div');
    div.className = 'server-icon' + (s.id === currentServerId ? ' active' : '');
    div.textContent = s.name.slice(0, 2).toUpperCase();
    div.title = s.name;
    div.onclick = () => selectServer(s.id);
    list.appendChild(div);
  });
}

async function selectServer(serverId) {
  currentServerId = serverId;
  currentChannelId = null;
  const server = servers.find(s => s.id === serverId);
  currentServerRole = server.role;
  document.getElementById('new-channel-btn').style.display =
    (currentServerRole === 'owner' || currentServerRole === 'admin') ? 'block' : 'none';
  document.getElementById('invite-box').textContent = 'Invite code: ' + server.invite_code;
  await refreshServers();
  await refreshChannels();
}

async function refreshChannels() {
  const channels = await api(`/api/servers/${currentServerId}/channels`);
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  channels.forEach(c => {
    const div = document.createElement('div');
    div.className = 'channel-item' + (c.id === currentChannelId ? ' active' : '');
    div.textContent = '# ' + c.name;
    div.onclick = () => selectChannel(c.id, c.name);
    list.appendChild(div);
  });
}

function selectChannel(channelId, name) {
  currentChannelId = channelId;
  document.getElementById('channel-header').textContent = '# ' + name;
  document.getElementById('message-input').disabled = false;
  refreshChannels();
  socket.emit('join_channel', {channel_id: channelId, user_id: me.user_id}, (resp) => {
    if (!resp.ok) { showError(resp.error); return; }
    loadHistory(channelId);
  });
}

async function loadHistory(channelId) {
  const messages = await api(`/api/channels/${channelId}/messages`);
  const box = document.getElementById('messages');
  box.innerHTML = '';
  messages.forEach(renderMessage);
}

function renderMessage(msg) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message';
  div.dataset.messageId = msg.message_id || msg.id;
  const canDelete = currentServerRole === 'owner' || currentServerRole === 'admin';
  div.innerHTML = `
    <div class="meta"><span class="author">${msg.username}</span>${msg.created_at}
      ${canDelete ? '<span class="del-btn" onclick="deleteMessage(' + (msg.message_id || msg.id) + ')">delete</span>' : ''}
    </div>
    <div class="content"></div>`;
  div.querySelector('.content').textContent = msg.content;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function deleteMessage(messageId) {
  socket.emit('delete_message', {message_id: messageId, user_id: me.user_id}, (resp) => {
    if (!resp.ok) showError(resp.error);
  });
}

function sendMessage() {
  const input = document.getElementById('message-input');
  const content = input.value.trim();
  if (!content || !currentChannelId) return;
  socket.emit('send_message', {channel_id: currentChannelId, user_id: me.user_id, content}, (resp) => {
    if (!resp.ok) showError(resp.error);
  });
  input.value = '';
}

async function promptCreateServer() {
  const name = prompt('Server name:');
  if (!name) return;
  try {
    await api('/api/servers', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, user_id: me.user_id})
    });
    await refreshServers();
  } catch (e) { showError(e.message); }
}

async function promptJoinServer() {
  const code = prompt('Invite code:');
  if (!code) return;
  try {
    await api('/api/servers/join', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({invite_code: code, user_id: me.user_id})
    });
    await refreshServers();
  } catch (e) { showError(e.message); }
}

async function promptCreateChannel() {
  const name = prompt('Channel name:');
  if (!name) return;
  try {
    await api(`/api/servers/${currentServerId}/channels`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, user_id: me.user_id})
    });
    await refreshChannels();
  } catch (e) { showError(e.message); }
}
</script>
</body>
</html>
